<style>

</style></head><body>
<div id="map"></div>
<div id="panel"><b>Tippe auf die Karte</b> <button id="loc">📍 Standort</button> <button id="inf">ℹ️ Bedingungen</button><br>
<select id="hb"></select> <select id="fc"><option value=".34">Boden lehmig</option><option value=".27" selected>Boden mittel</option><option value=".20">Boden sandig</option></select>
<br><label><input type="checkbox" id="wl"> 🌲 Waldkarte</label> <select id="hs"></select> <select id="hd"></select> <button id="hg">🗺️ Gute Gebiete</button> <button id="hc">✕</button> <small id="hm"></small>
<div id="out"><small>Wähle den Baum vor Ort und tippe auf die Karte.</small></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
//LOGIC
var H=["Fichte","Tanne","Buche","Eiche","Kiefer/Föhre","Lärche","Birke","Ahorn/Esche/Laubmisch","Erle/Auwald","Wiese/Waldrand/Obstgarten","Nadelwald (gemischt)","Laubwald (gemischt)","Mischwald"];
function hw(s,i){if(i<10)return s.h[i];var g=i==10?[0,1,4]:i==11?[2,3,6,7]:[0,1,2,3,4,6,7];return avg(g.map(function(j){return s.h[j]}))}
// Baumgewichte nach Sporensuche (Steinpilz exakt; andere Arten: voll=1, halb=.5, kaum=.1, nein=0)
var S=[
{n:"Steinpilz",k:"Stein",x:"Verwechslung: Gallenröhrling (rosa Röhren, dunkles grobes Stielnetz, sehr bitter). Röhrlinge mit roten Poren oder blau anlaufendem Fleisch sind keine Steinpilze.",h:[1,.6,.95,.85,.8,.2,.5,.35,0,0],rain:25,mode:"net",t:[12,15],tw:7,m1:[60,115],m2:[55,115],s:[6,8,11,12],a:[250,500,1700,2200]},
{n:"Pfifferling",k:"Pfiff.",h:[1,.5,1,1,1,.1,.5,.1,0,0],rain:25,mode:"bal",t:[12,20],tw:7,m1:[65,115],m2:[60,115],s:[6,7,11,12],a:[250,500,1600,2000]},
{n:"Marone",k:"Maron.",h:[1,.5,.5,.1,1,.1,.1,.1,0,0],rain:20,mode:"net",t:[9,15],tw:7,m1:[55,115],m2:[50,115],s:[7,9,11,12],a:[250,400,1300,1800]},
{n:"Morchel",k:"Morch.",h:[.1,.1,.1,.5,.1,.1,.1,1,.8,.6],rain:15,mode:"net",t:[8,16],tw:14,m1:[60,120],m2:null,s:[3,4,6,6],a:[250,350,1300,1800]},
{n:"Parasol",k:"Para.",h:[.5,.5,.5,1,1,1,1,.5,.1,.6],rain:22,mode:"net",t:[13,19],tw:7,m1:[55,115],m2:[50,115],s:[6,9,11,12],a:[250,350,1300,1800]}];
function lerp(p,x){if(x<=p[0][0])return p[0][1];for(var i=1;i<p.length;i++)if(x<=p[i][0])return p[i-1][1]+(p[i][1]-p[i-1][1])*(x-p[i-1][0])/(p[i][0]-p[i-1][0]);return p[p.length-1][1]}
function avg(a){a=a.filter(function(v){return v!=null&&!isNaN(v)});return a.reduce(function(s,v){return s+v},0)/a.length}
function trap(x,p){return x<=p[0]||x>=p[3]?0:x<p[1]?(x-p[0])/(p[1]-p[0]):x<=p[2]?1:(p[3]-x)/(p[3]-p[2])}
function season(x,p){if(x<=p[0]||x>=p[3])return 0;return Math.max(.15,trap(x,p))}
function fromApi(d,t){
 var q=d.daily,h=d.hourly,ti=14+t,E=ti*24;
 var P=function(k){return q.precipitation_sum[ti-k]||0},ET=function(k){return q.et0_fao_evapotranspiration[ti-k]||0};
 var net=0,bal=0,k;for(k=4;k<=14;k++)net+=Math.max(0,P(k)-.5*ET(k));
 for(k=1;k<=14;k++)bal+=P(k)-.5*ET(k);
 var sl=function(a,x,y){return a.slice(E-x,E-y)},soil=function(days){var c=days*24;return(avg(sl(h.soil_temperature_6cm,c,0))+avg(sl(h.soil_temperature_18cm,c,0)))/2};
 var tmin=[],tmax=[];for(k=1;k<=7;k++){tmin.push(q.temperature_2m_min[ti-k]);tmax.push(q.temperature_2m_max[ti-k])}
 return{net:net,bal:bal,t7:soil(7),t14:soil(14),m1:avg(sl(h.soil_moisture_3_to_9cm,72,0)),m2:avg(sl(h.soil_moisture_9_to_27cm,72,0)),
  tmin:Math.min.apply(null,tmin.filter(function(v){return v!=null})),tmax:avg(tmax),
  snow:Math.max.apply(null,sl(h.snow_depth,24,0).map(function(v){return(v||0)*100})),vpd:avg(sl(h.vapour_pressure_deficit,48,0)),alt:d.elevation}}
function score(w,hab,fc,m,day){
 var x=m+(day-1)/31;
 var fr=w.tmin<-4?.25:w.tmin<-1?.6:w.tmin<1?.85:1,he=w.tmax>30?.6:w.tmax>27?.85:1;
 var env=fr*he*lerp([[1,1],[5,.5],[15,.15]],w.snow)*lerp([[.6,1],[1.6,.5]],w.vpd);
 return S.map(function(s){
  var r=lerp([[2,0],[.32*s.rain,.4],[s.rain,1]],s.mode=="bal"?w.bal:w.net);
  var t=s.t,T=lerp([[t[0]-8,0],[t[0]-4,.35],[t[0]-2,.85],[t[0],1],[t[1],1],[t[1]+2,.75],[t[1]+5,.4],[t[1]+9,0]],s.tw==14?w.t14:w.t7);
  var mf=function(v,b){return lerp([[b[0]-35,0],[b[0],1],[b[1],1],[b[1]+25,0]],v/fc*100)};
  var M=s.m2?(mf(w.m1,s.m1)+mf(w.m2,s.m2))/2:mf(w.m1,s.m1);
  var wx=(((r+T+M)/3)+Math.exp((Math.log(Math.max(r,.001))+Math.log(Math.max(T,.001))+Math.log(Math.max(M,.001)))/3))/2;
  var A=trap(w.alt,s.a),Hb=hw(s,hab),Se=season(x,s.s);
  var F=[["Lebensraum",Hb],["Höhe",A],["Saison",Se],["Regen",r],["Bodentemperatur",T],["Bodenfeuchte",M],["Frost/Hitze/Schnee/Trockenheit",env]];
  var mn=F.reduce(function(a,b){return b[1]<a[1]?b:a});
  return{n:s.n,sc:Math.round(100*Hb*A*wx*env*Se),weak:mn[0],min:mn[1],f:{r:r,T:T,M:M,wx:wx}}
 })}
//ENDLOGIC
var $=function(i){return document.getElementById(i)};
H.forEach(function(h,i){$("hb").add(new Option(h,i))});
var MN=["Jan","Feb","Mär","Apr","Mai","Jun","Jul","Aug","Sep","Okt","Nov","Dez"],f1=function(x){return String(x).replace(".",",")};
function mr(a,b){return MN[a-1]+"–"+MN[b-1]}
function infoHtml(){
 return '<h2>So wird gerechnet</h2><p>Wert = Lebensraum × Höhe × Wetter × Saison × Abschläge. Das Wetter mischt Nettoregen, Bodentemperatur und Bodenfeuchte (halb Mittelwert, halb geometrisches Mittel). Pilze zeigen sich etwa 1 bis 2 Wochen nach kräftigem Regen, darum zählt der Regen der Tage 4 bis 14 vor dem Tag.</p><p><b>Abschläge:</b> Frost in den letzten 7 Tagen (Tmin unter 1 °C ×0,85, unter −1 °C ×0,6, unter −4 °C ×0,25) · Hitze (Ø Tmax über 27 °C ×0,85, über 30 °C ×0,6) · Schnee (ab 5 cm ×0,5, ab 15 cm ×0,15) · trockene Luft (Ø der letzten 48 h, Dampfdruckdefizit über 0,6 kPa, bis ×0,5).</p>'+
 S.map(function(s){
  var tr=H.map(function(x,i){return[x,s.h[i]]}).filter(function(x){return x[1]>=.5}).sort(function(a,b){return b[1]-a[1]}).map(function(x){return x[0]+" ("+f1(x[1])+")"}).join(", ");
  return '<h3>'+s.n+'</h3><ul><li>Saison: möglich '+mr(Math.floor(s.s[0]),Math.ceil(s.s[3])-1)+', Hauptzeit '+mr(s.s[1],s.s[2]-1)+'</li><li>Höhe: ideal '+s.a[1]+'–'+s.a[2]+' m (möglich '+s.a[0]+'–'+s.a[3]+' m)</li><li>Bodentemperatur (6/18 cm, '+(s.tw==14?'14-Tage':'Wochen')+'-Mittel): ideal '+s.t[0]+'–'+s.t[1]+' °C</li><li>'+(s.mode=="bal"?'Wasserbilanz der letzten 14 Tage':'Nettoregen der Tage 4–14')+': ab '+s.rain+' mm voll</li><li>Bodenfeuchte: ideal '+s.m1[0]+'–'+s.m1[1]+' % nFK (3–9 cm)'+(s.m2?', '+s.m2[0]+'–'+s.m2[1]+' % (9–27 cm)':'')+'</li><li>Bäume/Lebensraum (Gewicht): '+tr+'</li>'+(s.x?'<li>'+s.x+'</li>':'')+'</ul>'}).join("")+
 '<h2>Gut zu wissen</h2><ul><li>Baumgewichte: Steinpilz nach Sporensuche, übrige Arten gestuft (1 / 0,5 / 0,1). Höhenfaktor und Kurvenflanken sind Näherungen.</li><li>Schwellen stammen aus Deutschland (Sporensuche) und sind für die Schweiz nicht geprüft. Die Höhe verschiebt die Saison um bis zu 30 Tage (im Herbst früher in höheren Lagen, Andrew et al. 2018). Das ist nicht eingerechnet, die Bodentemperatur fängt es nur teilweise ab.</li><li>Prognose: Regen und Temperatur kommen wenn möglich vom MeteoSchweiz-Modell ICON (1–2 km, bis etwa 5 Tage), alles andere vom Standardmodell. Über 5 Tage hinaus bleibt jede Prognose unsicher.</li><li>Nadel-, Laub- und Mischwald sind Mittelwerte der Baumgewichte. Die Waldkarte (BAFU Waldmischungsgrad) zeigt, was vor Ort überwiegt.</li><li>Gute Gebiete: Das Wetter wird an 10×10 Punkten abgefragt (die Wettermodelle lösen ohnehin nur etwa 1–2 km auf) und auf ein Raster von 40×40 Zellen interpoliert. Pro Zelle zählen die Höhe aus dem 90-m-Höhenmodell (Temperaturen werden mit 0,65 °C pro 100 m angepasst) und der Waldanteil aus der BAFU-Karte (ab 50 % Wald voller Wert). Exposition und Baumart fliessen nicht ein. Tippe in die Karte für die Details eines Punktes.</li><li>Die Bewertung bestimmt keine Pilze. Nimm nur mit, was du sicher kennst, und nutze eine Pilzkontrolle (<a href="https://www.vapko.ch" target="_blank">VAPKO</a>). Kantonale Regeln beachten, z. B. Schonzeit in Graubünden vom 1. bis 10. jeden Monats.</li></ul><p><small>Quellen: Höhenmodell Copernicus GLO-90 via Open-Meteo · <a href="https://sporensuche.de/blog/wann-wachsen-pilze/" target="_blank">Sporensuche</a> · <a href="https://swissfungi.wsl.ch" target="_blank">SwissFungi</a> · Open-Meteo · © swisstopo</small></p>'}
$("ib").innerHTML=infoHtml();$("inf").onclick=function(){$("info").hidden=false};$("cl").onclick=function(){$("info").hidden=true};
var map=L.map("map").setView([46.8,8.2],8),mk=null,ci=null,DS=null,R=null,sel=0;
L.tileLayer("https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg",{maxZoom:18,attribution:"© swisstopo"}).addTo(map);
function compute(){
 R=[];for(var t=0;t<=7;t++){var dt=new Date();dt.setDate(dt.getDate()+t);
  R.push({dt:dt,w:fromApi(DS[0],t),per:DS.map(function(d){return score(fromApi(d,t),+$("hb").value,+$("fc").value,dt.getMonth()+1,dt.getDate())})})}
 draw()}
function A(t,i){var v=R[t].per.map(function(p){return p[i].sc});return{a:Math.round(avg(v)),lo:Math.min.apply(null,v),hi:Math.max.apply(null,v)}}
function draw(){
 var r=R[sel],w=r.w,al=DS.map(function(d){return d.elevation});
 var tb='<table><tr><th></th>'+S.map(function(s){return'<th>'+s.k+'</th>'}).join("")+'</tr>'+R.map(function(x,t){
  return'<tr data-t="'+t+'"'+(t==sel?' class="on"':'')+'><td>'+(t?x.dt.toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"numeric"}):"Heute")+'</td>'+S.map(function(s,i){var a=A(t,i).a;return'<td style="background:hsl(95 45% '+(96-.34*a)+'%)">'+a+'</td>'}).join("")+'</tr>'}).join("")+'</table>';
 var ord=S.map(function(s,i){return i}).sort(function(a,b){return A(sel,b).a-A(sel,a).a});
 $("out").innerHTML='<small>Prognose 8 Tage, Ø über Standort + 4 Punkte im 1-km-Umkreis (Höhe '+Math.round(Math.min.apply(null,al))+'–'+Math.round(Math.max.apply(null,al))+' m). Tippe auf einen Tag. '+icn()+'</small>'+tb+
  '<small>'+(sel?r.dt.toLocaleDateString("de-CH",{weekday:"long",day:"numeric",month:"numeric"}):"Heute")+': Nettoregen Tage 4–14 '+w.net.toFixed(0)+' mm · Boden '+w.t7.toFixed(1)+' °C · Feuchte '+(w.m1*100).toFixed(0)+' Vol.% · Tmin '+w.tmin.toFixed(0)+' °C</small>'+
  ord.map(function(i){var x=r.per[0][i],a=A(sel,i);return'<div class="r"><span>'+x.n+'</span><span>'+a.a+(a.lo!=a.hi?' <small>('+a.lo+'–'+a.hi+')</small>':'')+'</span></div><div class="b"><i style="width:'+a.a+'%"></i></div><small>'+(x.min<.3?'Bremse: '+x.weak+' ('+x.min.toFixed(2)+')':'Wetter '+x.f.wx.toFixed(2)+' (Regen '+x.f.r.toFixed(2)+', Boden-°C '+x.f.T.toFixed(2)+', Feuchte '+x.f.M.toFixed(2)+')')+'</small>'}).join("")+
  '<p><small>Schwellen nach <a href="https://sporensuche.de/blog/wann-wachsen-pilze/" target="_blank">Sporensuche</a> (Deutschland, für die Schweiz nicht geprüft). Prognose = Modellwetter, unsicher. Funde: <a href="https://swissfungi.wsl.ch" target="_blank">SwissFungi</a> · Wetter: Open-Meteo · © swisstopo</small></p>'}
function analyse(lat,lng){
 var c=[lat,lng];if(mk)mk.setLatLng(c);else mk=L.marker(c).addTo(map);
 if(ci)ci.setLatLng(c);else ci=L.circle(c,{radius:1000,color:"#4f7a2e",weight:2,fillOpacity:.1}).addTo(map);
 $("out").innerHTML="<small>Lade Wetterdaten …</small>";
 var dl=1/111.32,dg=dl/Math.cos(lat*Math.PI/180),pts=[[lat,lng],[lat+dl,lng],[lat,lng+dg],[lat-dl,lng],[lat,lng-dg]];
 Promise.all(pts.map(function(p){return fetch(U([p[0]],[p[1]]))
  .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}))
 .then(function(ds){return withIcon(ds,pts)}).then(function(ds){DS=ds;sel=0;compute()}).catch(function(e){$("out").innerHTML="<small>Fehler: "+e.message+"</small>"})}

var DV="&daily=precipitation_sum,et0_fao_evapotranspiration,temperature_2m_max,temperature_2m_min&hourly=soil_temperature_6cm,soil_temperature_18cm,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm,vapour_pressure_deficit,snow_depth",ICN=0;
function U(la,ln){return"https://api.open-meteo.com/v1/forecast?latitude="+la.join(",")+"&longitude="+ln.join(",")+"&past_days=14&forecast_days=8&timezone=auto"+DV}
function icn(){return ICN>0?"Regen/Temp: MeteoSchweiz ICON ("+ICN+" Tageswerte).":"Regen/Temp: Standardmodell."}
function merge(d,c){var ix={},n=0;c.daily.time.forEach(function(t,i){ix[t]=i});
 ["precipitation_sum","temperature_2m_max","temperature_2m_min"].forEach(function(k){d.daily.time.forEach(function(t,i){var j=ix[t];if(j!=null&&c.daily[k]&&c.daily[k][j]!=null){d.daily[k][i]=c.daily[k][j];if(k=="precipitation_sum")n++}})});return n}
function withIcon(ds,pts){ICN=-1;
 return fetch("https://api.open-meteo.com/v1/forecast?latitude="+pts.map(function(p){return p[0]}).join(",")+"&longitude="+pts.map(function(p){return p[1]}).join(",")+"&models=meteoswiss_icon_seamless&past_days=14&forecast_days=8&timezone=auto&daily=precipitation_sum,temperature_2m_max,temperature_2m_min")
 .then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var a=Array.isArray(j)?j:[j];if(a.length!=ds.length)throw 0;var n=0;ds.forEach(function(d,i){n+=merge(d,a[i])});ICN=n;return ds}).catch(function(){ICN=-1;return ds})}
var wk=L.tileLayer.wms("https://wms.geo.admin.ch/",{layers:"ch.bafu.landesforstinventar-waldmischungsgrad",format:"image/png",transparent:true,version:"1.3.0",opacity:.6,attribution:"© BAFU"}),HL=L.layerGroup().addTo(map);
$("wl").onchange=function(){if(this.checked)wk.addTo(map);else map.removeLayer(wk)};
S.forEach(function(s,i){$("hs").add(new Option(s.n,i))});
for(var q=0;q<=7;q++){var dd=new Date();dd.setDate(dd.getDate()+q);$("hd").add(new Option(q?dd.toLocaleDateString("de-CH",{weekday:"short",day:"numeric",month:"numeric"}):"Heute",q))}
$("hc").onclick=function(){HL.clearLayers();$("hm").textContent=""};
var G=40,C=10,OV=4,LAPSE=.0065,FLD=["net","bal","t7","t14","m1","m2","tmin","tmax","snow","vpd","alt"];
function bil(g,u,v){u=Math.max(0,Math.min(C-1,u));v=Math.max(0,Math.min(C-1,v));var i=Math.min(C-2,Math.floor(u)),j=Math.min(C-2,Math.floor(v)),a=u-i,b=v-j;
 return g[i*C+j]*(1-a)*(1-b)+g[i*C+j+1]*(1-a)*b+g[(i+1)*C+j]*a*(1-b)+g[(i+1)*C+j+1]*a*b}
function elev(la,ln){var ch=[];for(var i=0;i<la.length;i+=100)ch.push(fetch("https://api.open-meteo.com/v1/elevation?latitude="+la.slice(i,i+100).join(",")+"&longitude="+ln.slice(i,i+100).join(",")).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return j.elevation}));
 return Promise.all(ch).then(function(a){return[].concat.apply([],a)}).catch(function(){return null})}
function forest(b){return new Promise(function(res){var n=G*OV,im=new Image();im.crossOrigin="anonymous";
 im.onload=function(){try{var c=document.createElement("canvas");c.width=c.height=n;var x=c.getContext("2d");x.drawImage(im,0,0);var d=x.getImageData(0,0,n,n).data,f=[],t=0,i,j,a,e,s;
  for(i=0;i<G;i++)for(j=0;j<G;j++){s=0;for(a=0;a<OV;a++)for(e=0;e<OV;e++)if(d[((i*OV+a)*n+j*OV+e)*4+3]>40)s++;f.push(s/(OV*OV));t+=s}
  var q=t/(n*n);res(q>.03&&q<.97?f:null)}catch(e){res(null)}};
 im.onerror=function(){res(null)};
 im.src="https://wms.geo.admin.ch/?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=ch.bafu.landesforstinventar-waldmischungsgrad&STYLES=&CRS=EPSG:4326&BBOX="+[b.getSouth(),b.getWest(),b.getNorth(),b.getEast()].join(",")+"&WIDTH="+n+"&HEIGHT="+n+"&FORMAT=image/png&TRANSPARENT=TRUE"})}
$("hg").onclick=function(){
 if(map.getZoom()<9){$("hm").textContent="Näher heranzoomen (ab Zoom 9, für feine Details ab 11).";return}
 var b=map.getBounds(),N=b.getNorth(),S0=b.getSouth(),E=b.getEast(),W0=b.getWest(),pts=[],fl=[],fn=[],i,j;
 for(i=0;i<C;i++)for(j=0;j<C;j++)pts.push([N-(i+.5)*(N-S0)/C,W0+(j+.5)*(E-W0)/C]);
 for(i=0;i<G;i++)for(j=0;j<G;j++){fl.push(+(N-(i+.5)*(N-S0)/G).toFixed(4));fn.push(+(W0+(j+.5)*(E-W0)/G).toFixed(4))}
 $("hm").textContent="Berechne …";var fp=forest(b),ep=elev(fl,fn);
 fetch(U(pts.map(function(p){return p[0]}),pts.map(function(p){return p[1]}))).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})
